name: Web en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Solo en el repositorio público; en forks y en el repositorio privado no se publica.
    if: github.repository == 'churrufli/mazmorreo-rpg'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La web lleva el número de la última APK publicada y, si hay cambios fusionados después, cuántos (v0.143+2).
      - name: Version number
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v0.*' 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            echo "export const BUILD: number = ${TAG#v0.};" > src/version.ts
            echo "export const CAMBIOS: number = $(git rev-list --count "$TAG"..HEAD);" > src/versionWeb.ts
          fi
      - run: npm run web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
